[project]
name = "pgz-driver"
version = "0.1.0"
description = "Headless Pygame Zero driver for agents — daemon + `pgz` CLI."
requires-python = ">=3.12"
dependencies = [
    "pgzero>=1.2.1",
]

[project.scripts]
pgz = "pgzd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pgzd"]
